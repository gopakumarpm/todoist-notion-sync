<title>Tern Command Centre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Tern Command Centre — single-theme (bridge-dark), every colour painted. Navy #0C1B2E · Blue #2878CC · Gold #C9A43E */
:root{--ground:#0A1523;--panel:#0F1F33;--raise:#16304C;--line:#1F3A57;--line-soft:#172C45;--blue:#2878CC;--blue-soft:#5FA0E0;--gold:#C9A43E;--gold-soft:#E3C878;
 --ink:#E8EDF4;--dim:#8FA3BC;--faint:#5B7089;--ok:#5FA86A;--run:#4A8FD6;--warn:#D07A8E;--wait:#C9A43E;--off:#5B6C82;
 --disp:'Montserrat',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--sidew:196px;--barh:54px}
*{box-sizing:border-box;margin:0}
html{height:100%}body{min-height:100%;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}a{color:var(--blue-soft)}
input,select{font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
input:focus,select:focus{border-color:var(--gold);outline:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.shell{display:grid;grid-template-columns:var(--sidew) minmax(0,1fr) 340px;min-height:100vh}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line-soft);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.mark{font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:.14em;padding:4px 8px 14px}.mark b{color:var(--gold);font-weight:800}
.mark small{display:block;font-size:8px;letter-spacing:.3em;font-weight:600;color:var(--dim);margin-top:-1px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--dim);font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid transparent}
.nav:hover{color:var(--ink);background:var(--raise)}.nav[aria-current=page]{color:var(--gold-soft);background:var(--ground);border-color:var(--line-soft)}
.nav svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);font-weight:500}
.side .mode{margin-top:auto;padding:10px;border-top:1px solid var(--line-soft);font-family:var(--mono);font-size:10.5px;color:var(--faint);line-height:1.6}
.side .mode b{color:var(--ok);font-weight:500}.side .mode b.static{color:var(--gold-soft)}
/* main */
main{padding:0 24px 40px;min-width:0}
.bar{position:sticky;top:0;z-index:5;height:var(--barh);display:flex;align-items:center;gap:12px;background:#0A1523F0;backdrop-filter:blur(6px);border-bottom:1px solid var(--line-soft);margin:0 -24px 20px;padding:0 24px}
.bar h1{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:-.01em}.bar h1 small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--dim);margin-left:10px}
.searchwrap{margin-left:auto;position:relative;flex:0 1 300px;min-width:150px}
.search{width:100%;padding-left:32px}.searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:none;stroke:var(--faint);stroke-width:2}
.eyebrow{font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim);display:inline-flex;align-items:center;gap:6px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--dim))}.chip:hover{color:var(--ink);border-color:var(--dim)}.chip[aria-pressed=true]{color:var(--ink);border-color:var(--c,var(--gold));background:var(--raise)}
.pill{display:inline-block;font-family:var(--disp);font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.4;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:14px 16px}
.grid{display:grid;gap:10px}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px}.kpi:hover{border-color:var(--line)}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;color:var(--gold-soft);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-family:var(--disp);font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}.kpi em{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:4px}
.cos{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:20px}
.co{background:var(--panel);border:1px solid var(--line-soft);border-top:3px solid var(--c);border-radius:8px;padding:12px 13px;display:flex;flex-direction:column;gap:6px}
.co:hover{background:var(--raise);border-color:var(--line);border-top-color:var(--c)}
.co .top{display:flex;gap:10px;align-items:center}.co .nm{font-family:var(--disp);font-weight:700;font-size:13px;line-height:1.25}.co .hd{font-size:11px;color:var(--dim)}
.co .cnt{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--c);font-variant-numeric:tabular-nums}.co .cnt small{font-size:10px;color:var(--faint);font-family:var(--disp);letter-spacing:.14em;text-transform:uppercase;margin-left:4px}
.co .faces{display:flex;flex-wrap:wrap;gap:3px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.list{list-style:none;display:flex;flex-direction:column;gap:2px}
.list li button,.list li .row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;padding:7px 8px;border-radius:6px;font-size:12.5px}
.list li button:hover{background:var(--raise)}.list b{font-weight:600}.list .sub{color:var(--dim);font-size:11.5px;display:block}.list .as{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
/* agents */
.agents{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.ag{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.ag:hover{background:var(--raise)}.ag.sel{border-color:var(--gold)}.ag b{display:block;font-weight:600;font-size:12.5px;line-height:1.25}.ag span{display:block;font-size:11px;color:var(--dim);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ag .st{font-family:var(--mono);font-size:9.5px;margin-top:5px;color:var(--faint)}.ag .st.paper{color:var(--wait)}
.av{flex:none;image-rendering:pixelated;border-radius:4px;background:var(--ground)}
/* skills */
.skills{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.sk{background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;padding:9px 11px}.sk:hover{background:var(--raise)}.sk.sel{border-color:var(--gold)}
.sk b{display:block;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--gold-soft)}.sk span{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sk .faces{display:flex;gap:3px;margin-top:6px;min-height:14px}
/* flows */
.flows{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
.flowlist{list-style:none;display:flex;flex-direction:column;gap:4px}.flowlist button{width:100%;padding:9px 11px;border-radius:7px;border:1px solid transparent}.flowlist button:hover{background:var(--panel)}.flowlist button[aria-current=true]{background:var(--panel);border-color:var(--line-soft)}
.flowlist b{display:block;font-weight:600;font-size:13px}.flowlist span{font-size:11px;color:var(--dim)}
.pipe{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:14px 4px 10px}
.step{flex:0 0 150px;position:relative;padding:0 8px}
.step+.step::before{content:"";position:absolute;left:-8px;top:23px;width:16px;height:2px;background:var(--line)}
.step .box{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:10px 10px 8px;height:100%;border-top:3px solid var(--sc,var(--line))}
.step.on .box{border-color:var(--gold);box-shadow:0 0 0 3px #C9A43E22}
.step b{display:block;font-size:12px;font-weight:600;line-height:1.25}.step .who{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-top:5px}.step .note{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.35}
.step .st{font-family:var(--mono);font-size:9.5px;margin-top:6px;color:var(--sc,var(--faint))}
.runbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
.btn{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:6px;border:1px solid var(--line);color:var(--ink)}.btn:hover{border-color:var(--gold);color:var(--gold-soft)}.btn.primary{background:var(--gold);color:#0A1523;border-color:var(--gold)}.btn.primary:hover{color:#0A1523;background:var(--gold-soft)}
.btn[disabled]{opacity:.45;cursor:default}
.log{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--ground);border:1px solid var(--line-soft);border-radius:6px;padding:10px 12px;max-height:200px;overflow:auto;white-space:pre-wrap}
/* tables */
.tblwrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-family:var(--disp);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}.tbl tr:hover td{background:var(--panel)}
.tbl .who{display:flex;align-items:center;gap:7px;white-space:nowrap}
/* generations */
.gens{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.gen{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}.gen:hover{background:var(--raise)}.gen.sel{border-color:var(--gold)}
.gen .h{display:flex;justify-content:space-between;gap:8px;align-items:center}.gen b{font-weight:600;font-size:13px;line-height:1.3}.gen .sum{font-size:11.5px;color:var(--dim)}.gen .who{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-top:auto}
/* docs */
.docs{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px}
.md{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:20px 24px;max-width:78ch;font-size:13.5px;line-height:1.6}
.md h1{font-family:var(--disp);font-size:20px;font-weight:700;margin-bottom:10px;text-wrap:balance}.md h2{font-family:var(--disp);font-size:14px;font-weight:700;margin:18px 0 6px;color:var(--gold-soft)}.md h3{font-family:var(--disp);font-size:12.5px;font-weight:700;margin:14px 0 4px}
.md p{margin:6px 0}.md ul,.md ol{margin:6px 0 6px 22px}.md li{margin:2px 0}.md code{font-family:var(--mono);font-size:12px;background:var(--ground);padding:1px 5px;border-radius:4px}.md pre{background:var(--ground);border:1px solid var(--line-soft);border-radius:6px;padding:10px 12px;overflow:auto;margin:8px 0}.md pre code{background:none;padding:0}
.md blockquote{border-left:2px solid var(--gold);padding-left:12px;color:var(--dim);margin:8px 0}.md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.md table{border-collapse:collapse;font-size:12.5px;margin:8px 0;display:block;overflow-x:auto}.md th,.md td{border:1px solid var(--line-soft);padding:5px 9px;text-align:left;vertical-align:top}.md th{color:var(--dim);font-family:var(--disp);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
/* sprints */
.sprinthead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:14px}.sprinthead .goal{color:var(--dim);font-size:12.5px;max-width:60ch}
.prog{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden;width:220px}.prog i{display:block;height:100%;background:var(--ok)}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col h3{font-family:var(--disp);font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px;margin-bottom:8px}.col h3 .n{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto;font-weight:500}
.col .stack{display:flex;flex-direction:column;gap:8px}
.task{background:var(--panel);border:1px solid var(--line-soft);border-left:3px solid var(--pc);border-radius:6px;padding:9px 10px}
.task b{display:block;font-weight:600;font-size:12.5px;line-height:1.3}.task .m{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-top:6px;flex-wrap:wrap}
.task .act{display:flex;gap:4px;margin-top:8px}.task .act button{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border:1px solid var(--line-soft);border-radius:4px;color:var(--dim)}.task .act button:hover{color:var(--ink);border-color:var(--dim)}
.addtask{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.addtask input{flex:1 1 240px}
/* live scene */
.livebar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.livebar .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stage{position:relative;height:calc(100vh - 175px);min-height:520px;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.tip{position:absolute;pointer-events:none;display:none;background:#0B1828F2;border:1px solid var(--line);border-left:2px solid var(--gold);padding:6px 10px;font-size:12px;border-radius:0 6px 6px 0;max-width:260px;z-index:3}
.tip small{display:block;font-family:var(--disp);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.ticker{margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--dim);background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:9px 12px;display:flex;gap:10px;align-items:center;min-height:38px}
.ticker i{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}.ticker b{color:var(--ink);font-weight:500}
/* links */
.linkgroups{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.lk{display:block;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:12.5px}.lk:hover{background:var(--raise)}.lk span{display:block;color:var(--dim);font-size:11px}
/* detail */
aside.detail{border-left:1px solid var(--line-soft);background:var(--panel);padding:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.detail .empty{color:var(--faint);font-size:12.5px;line-height:1.55}.detail .kind{font-family:var(--disp);font-size:9.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.detail .name{font-family:var(--disp);font-weight:700;font-size:17px;line-height:1.25;margin:4px 0;text-wrap:balance}.detail .meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:10px;line-height:1.5}
.detail .sec{margin-top:14px}.detail .sec h4{font-family:var(--disp);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.detail .lnk{display:flex;align-items:center;gap:8px;width:100%;padding:5px 6px;border-radius:5px;font-size:12.5px}.detail .lnk:hover{background:var(--raise)}.detail .lnk b{white-space:nowrap;flex:none;font-weight:600}.detail .lnk span{color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.detail .md{padding:0;border:0;background:none;font-size:12.5px}.detail .close{display:none}
.detail .hero{display:flex;gap:12px;align-items:center;margin:6px 0 8px}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--faint);line-height:1.6}
@media (max-width:1150px){.shell{grid-template-columns:var(--sidew) minmax(0,1fr)}aside.detail{position:fixed;inset:auto 0 0 0;height:auto;max-height:72vh;border-left:0;border-top:1px solid var(--line);border-radius:12px 12px 0 0;box-shadow:0 -12px 40px #00000088;transform:translateY(105%);transition:transform .25s ease;z-index:30}
 aside.detail.open{transform:none}.detail .close{display:block;position:absolute;right:12px;top:10px;font-family:var(--mono);font-size:12px;color:var(--dim);padding:4px 8px;border:1px solid var(--line);border-radius:6px}
 .cos{grid-template-columns:repeat(3,minmax(0,1fr))}.kan{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:820px){.shell{grid-template-columns:1fr}.side{position:sticky;top:0;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:2px;padding:8px 10px;z-index:6}.side .mark{padding:0 8px;font-size:13px;flex:none;align-self:center}.side .mark small{display:none}
 .nav{padding:6px 9px;font-size:10.5px;white-space:nowrap}.nav .n{display:none}.side .mode{display:none}main{padding:0 16px 40px}.bar{margin:0 -16px 16px;padding:0 16px;height:auto;min-height:var(--barh);flex-wrap:wrap;padding-block:8px}.bar h1 small{display:block;margin:0}
 .searchwrap{flex:1 1 100%;margin:0}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cos{grid-template-columns:1fr 1fr}.kan{grid-template-columns:1fr}.flows,.docs{grid-template-columns:1fr}.prog{width:100%}}
@media (prefers-reduced-motion:reduce){aside.detail{transition:none}}
</style>

// ---------- pixel avatar: deterministic 8x8 symmetric face, coloured by company ----------
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return h;}
function avatarCells(id){let h=hash(id||'?');const bits=[];for(let i=0;i<32;i++){bits.push(h&1);h>>>=1;}
  const cells=[];for(let y=0;y<8;y++)for(let x=0;x<4;x++){let on=bits[(y*4+x)%32];if(y===2&&(x===1||x===2))on=1;if(y===3&&x===1)on=0;if(y===0||y===7)on=on&&(x>0);if(on){cells.push([x,y]);cells.push([7-x,y]);}}return cells;}
function avatar(id,color,size=32){const cells=avatarCells(id);
  const eye=`<rect x="2" y="3" width="1" height="1" fill="#0A1523"/><rect x="5" y="3" width="1" height="1" fill="#0A1523"/>`;
  return `<svg class="av" width="${size}" height="${size}" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">${cells.map(([x,y])=>`<rect x="${x}" y="${y}" width="1" height="1" fill="${color}"/>`).join('')}${eye}</svg>`;}
const face=(id,size=18)=>{const a=A(id);return avatar(id,a?coColor(a.company):'#8FA3BC',size);};
const who=(id,size=18)=>`<span class="who">${face(id,size)}<span>${esc(nameOf(id))}</span></span>`;

// ---------- tiny markdown ----------
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/→/g,'→');}
function md(src){const out=[];const lines=src.split(/\r?\n/);let i=0;
  while(i<lines.length){let l=lines[i];
    if(/^```/.test(l)){const buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))buf.push(lines[i++]);i++;out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);continue;}
    if(/^\|/.test(l)){const rows=[];while(i<lines.length&&/^\|/.test(lines[i]))rows.push(lines[i++]);const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(rows[0]);const body=rows.slice(rows[1]&&/^\|?\s*-/.test(rows[1])?2:1);out.push(`<table><thead><tr>${head.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${cells(r).map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);continue;}
    const h=l.match(/^(#{1,3})\s+(.*)/);if(h){out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);i++;continue;}
    if(/^---+$/.test(l.trim())){out.push('<hr>');i++;continue;}
    if(/^>\s?/.test(l)){const buf=[];while(i<lines.length&&/^>\s?/.test(lines[i]))buf.push(lines[i++].replace(/^>\s?/,''));out.push(`<blockquote>${inline(buf.join(' '))}</blockquote>`);continue;}
    if(/^\s*[-*]\s+/.test(l)){const buf=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i]))buf.push(lines[i++].replace(/^\s*[-*]\s+/,''));out.push(`<ul>${buf.map(x=>`<li>${inline(x)}</li>`).join('')}</ul>`);continue;}
    if(/^\s*\d+\.\s+/.test(l)){const buf=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i]))buf.push(lines[i++].replace(/^\s*\d+\.\s+/,''));out.push(`<ol>${buf.map(x=>`<li>${inline(x)}</li>`).join('')}</ol>`);continue;}
    if(!l.trim()){i++;continue;}
    const buf=[];while(i<lines.length&&lines[i].trim()&&!/^(#{1,3}\s|```|\||>|\s*[-*]\s|\s*\d+\.\s|---+$)/.test(lines[i]))buf.push(lines[i++]);out.push(`<p>${inline(buf.join(' '))}</p>`);}
  return out.join('');}

function nav(){side.innerHTML=`<div class="mark">TERN<b>OS</b><small>COMMAND CENTRE</small></div>`+PANELS.map(([k,l])=>`<button class="nav" data-act="view" data-id="${k}" ${k===view?'aria-current="page"':''}>${ICONS[k]}${l}<span class="n">${k==='overview'?'':(S.counts[k]??'')}</span></button>`).join('')+

function go(v,o={}){view=v;if('co' in o)filterCo=o.co;query='';q.value='';history.replaceState(null,'','#'+v);render();window.scrollTo({top:0});}
function render(){liveStop();nav();$('title').innerHTML=query?`Search<small>${countHits()} results for “${esc(q.value)}”</small>`:TITLE[view]();
  main.innerHTML=query?renderSearch():R[view]();if(view==='live'&&!query)liveStart();$('foot').innerHTML=`${S.counts.agents} agents · ${S.counts.skills} skills · ${S.counts.flows} flows · ${S.counts.crons} crons · ${S.counts.generations} generations · ${S.counts.docs} docs · workspace/ is the source of truth; the page only renders it.`;markSel();}

function coChips(){return `<div class="chips"><button class="chip" data-act="cochip" data-id="" aria-pressed="${!filterCo}">All</button>${S.companies.map(c=>`<button class="chip" data-act="cochip" data-id="${esc(c.key)}" style="--c:${c.color}" aria-pressed="${filterCo===c.key}"><i></i>${esc(c.short)} <span class="mono" style="font-size:10px;color:var(--faint)">${S.agents.filter(a=>a.company===c.key).length}</span></button>`).join('')}</div>`;}

const R={};
R.overview=()=>{const paper=S.agents.filter(a=>a.status==='paper').length, running=S.flows.flatMap(f=>f.runs.filter(r=>r.status==='running').map(r=>[f,r]));
  const sp=S.sprints[0]||{tasks:[]}; const done=sp.tasks.filter(t=>t.status==='done').length; const badCrons=S.crons.filter(c=>!c.enabled||!['ok','new'].includes(c.status));

R.agents=()=>{const rows=S.agents.filter(a=>!filterCo||a.company===filterCo);return coChips()+`<div class="grid agents">${rows.map(a=>`<button class="ag" data-act="agent" data-id="${esc(a.id)}">${avatar(a.id,coColor(a.company),40)}<div><b>${esc(a.name)}</b><span>${esc(a.role)}</span><div class="st ${a.status}">${a.status==='paper'?'ON PAPER':a.lead?'LEAD':esc((CO(a.company)||{}).short||'')}${a.skills.length?' · '+a.skills.length+' skills':''}</div></div></button>`).join('')}</div>`;};

R.flows=()=>{const f=S.flows.find(x=>x.id===flowId)||S.flows[0];if(!f)return '<p class="sub">No flows.</p>';flowId=f.id;const run=f.runs.find(r=>r.id===runId)||f.runs.find(r=>r.status==='running')||f.runs[0];runId=run?run.id:null;

   <div class="runbar"><label class="mono" style="font-size:11px;color:var(--dim)">Run</label><select id="runsel">${f.runs.map(r=>`<option value="${esc(r.id)}" ${run&&r.id===run.id?'selected':''}>${esc(r.name||r.id)} · ${esc(r.status)}</option>`).join('')}</select>

// ---------- search ----------
function hits(){const h=[];const m=s=>String(s||'').toLowerCase().includes(query);
  S.agents.forEach(a=>{if(m(a.name+' '+a.role+' '+a.company+' '+a.arm+' '+a.skills.join(' ')))h.push(['agent',a.id,a.name,a.role,coColor(a.company)]);});
  S.skills.forEach(s=>{if(m(s.name+' '+s.summary))h.push(['skill',s.id,s.name,s.summary,'var(--gold)']);});
  S.flows.forEach(f=>{if(m(f.name+' '+f.description))h.push(['flow',f.id,f.name,f.description,'var(--run)']);});
  S.crons.forEach(c=>{if(m(c.name+' '+c.note))h.push(['cron',c.id,c.name,c.human,'var(--wait)']);});
  S.generations.forEach(g=>{if(m(g.title+' '+g.summary+' '+g.body))h.push(['gen',g.id,g.title,g.summary,'var(--gold-soft)']);});
  S.docs.forEach(d=>{if(m(d.title+' '+d.body))h.push(['doc',d.id,d.title,'doc','var(--blue-soft)']);});
  (S.sprints[0]||{tasks:[]}).tasks.forEach(t=>{if(m(t.title+' '+t.notes+' '+t.owner))h.push(['task',t.id,t.title,t.status+' · '+nameOf(t.owner),PRI[t.priority]]);});
  return h;}
const countHits=()=>hits().length;
function renderSearch(){return `<ul class="list">${hits().slice(0,80).map(h=>`<li><button data-act="${h[0]}" data-id="${esc(h[1])}"><span class="dot" style="background:${h[4]}"></span><span><b>${esc(h[2])}</b><span class="sub">${esc(h[3])}</span></span><span class="mono" style="font-size:10px;color:var(--faint)">${h[0]}</span></button></li>`).join('')||'<li class="sub">No matches.</li>'}</ul>`;}

function startPlay(){stopPlay();const f=S.flows.find(x=>x.id===flowId);const run=f&&f.runs.find(r=>r.id===runId);if(!run)return;const steps=main.querySelectorAll('.step');const log=$('log');let i=0;log.textContent='';
  const tick=()=>{steps.forEach(s=>s.classList.remove('on'));if(i>=f.steps.length){stopPlay();log.textContent+='\n— end of run —';return;}const s=f.steps[i],st=run.steps.find(x=>x.id===s.id)||{status:'pending'};steps[i].classList.add('on');steps[i].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
    log.textContent+=`${st.status.padEnd(8)} ${s.name} · ${nameOf(s.agent)}${st.note?' — '+st.note:''}\n`;log.scrollTop=log.scrollHeight;i++;};tick();play=setInterval(tick,900);}

// ---------- events ----------
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==='view')go(id);else if(a==='cochip'){filterCo=id||null;render();}else if(a==='close')detail.classList.remove('open');
  else if(a==='lfocus'){LIVE.focus=LIVE.focus===id?null:id;render();}else if(a==='lpause'){LIVE.paused=!LIVE.paused;render();}else if(a==='lspeed'){LIVE.speed=LIVE.speed>=4?1:LIVE.speed*2;render();}else if(a==='ltog'){LIVE[id]=!LIVE[id];render();}
  else if(a==='co'){go('agents',{co:id});D.co(id);}else if(a==='agentsco'){go('agents',{co:id});}
  else if(a==='agent')D.agent(id);else if(a==='skill'){D.skill(id);}else if(a==='flow'){flowId=id;runId=null;stopPlay();if(view!=='flows')go('flows');else render();}
  else if(a==='flowrun'){const [f,r]=id.split('|');flowId=f;runId=r;stopPlay();go('flows');}else if(a==='step')D.step(id);else if(a==='play')startPlay();else if(a==='stop')stopPlay();
  else if(a==='cron'){D.cron(id);}else if(a==='gen'){D.gen(id);}else if(a==='doc'){docId=id;if(view!=='docs')go('docs');else render();}
  else if(a==='task'){D.task(id);}else if(a==='move'){const [tid,status]=id.split('|');await api(`/api/sprints/${S.sprints[0].id}/tasks/${tid}`,'PATCH',{status});await refresh(true);}
});
document.addEventListener('change',e=>{if(e.target.id==='runsel'){runId=e.target.value;stopPlay();render();}});
document.addEventListener('submit',async e=>{if(e.target.id!=='addtask')return;e.preventDefault();const fd=new FormData(e.target);await api(`/api/sprints/${S.sprints[0].id}/tasks`,'POST',{title:fd.get('title'),owner:fd.get('owner'),priority:fd.get('priority')});e.target.reset();await refresh(true);});
q.addEventListener('input',()=>{query=q.value.trim().toLowerCase();render();});
async function api(url,method,body){try{const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json();}catch(err){alert('Write failed: '+err.message);}}

// ---------- boot ----------
async function refresh(force){if(window.__STATE__&&!force){S=window.__STATE__;return;}try{const r=await fetch('/api/state',{cache:'no-store'});const s=await r.json();if(!S||force||s.generated!==S.generated){S=s;render();}}catch{}}
(async()=>{if(window.__STATE__){S=window.__STATE__;}else{await refresh(true);if(!S){main.innerHTML='<p class="empty">Could not load /api/state — run <code>node server.js</code>.</p>';return;}}
  const h=location.hash.replace('#','');if(PANELS.some(p=>p[0]===h))view=h;render();
  if(S.mode==='live')setInterval(()=>refresh(false),5000);})();
})();
</script>
