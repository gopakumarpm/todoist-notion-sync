<style>

.flowlist{list-style:none;display:flex;flex-direction:column;gap:4px}.flowlist button{width:100%;padding:9px 11px;border-radius:7px;border:1px solid transparent}.flowlist button:hover{background:var(--panel)}.flowlist button[aria-current=true]{background:var(--panel);border-color:var(--line-soft)}

:1600,"note":"charter/reviews/2026-W37-weekly-review.md"},{"id":"deliver","status":"done","ms":200,"note":"Delivered in session; Routine disabled (no connectors)"}]},{"id":"2026-W38","name":"First scheduled run","started":"","ended":"","status":"scheduled","trigger":"cron","steps":[]}],"name":"Weekly Group Review","description":"Every Monday 08:00 IST Max reviews the whole group and hands Gopakumar one 15-section report. Skills are rated and upgraded first; nothing runs on stale capability.","trigger":"cron:weekly-group-review","owner":"max"}],"crons":[{"id":"weekly-group-review","name":"Weekly Group Review","schedule":"30 2 * * 1","human":"Monday 08:00 IST","tz":"Asia/Kolkata","flow":"weekly-group-review","agent":"max","enabled":false,"status":"needs-connectors","last_run":"2026-09-11 (manual baseline, 2026-W37)","next_run":"2026-09-14 08:00 IST once recreated","note":"Routine trig_0131Sweeqtjm2BAeg1ZMV6WF was created without connectors and is disabled. Recreate from the claude.ai Routines page with Google Drive, Notion and Todoist attached; prompt in charter/reviews/ROUTINE-PROMPT-weekly-review.md."},{"id":"daily-vault-capture","name":"Daily vault capture","schedule":"0 21 * * *","human":"Daily 21:00 IST","tz":"Asia/Kolkata","flow":"","agent":"hannah-brooks","enabled":true,"status":"ok","last_run":"2026-09-11 21:00 IST","next_run":"2026-09-12 21:00 IST","note":"Pulls Calendar + Todoist + Notion + Gmail into the day's Obsidian note (scheduled task daily-vault-capture on the desktop)."},{"id":"hdfc-ergo-reviews","name":"HDFC Ergo reviews","schedule":"30 9 * * 2,5","human":"Tue & Fri 15:00 IST","tz":"Asia/Kolkata","flow":"","agent":"anjali-rao","enabled":true,"status":"ok","last_run":"2026-09-11 15:00 IST","next_run":"2026-09-15 15:00 IST","note":"Taurus site review; prep pack from the Taurus Ops Dashboard."},{"id":"pets-weekly-check","name":"Pluto & Bannu weekly check","schedule":"30 3 * * 6","human":"Saturday 09:00 IST","tz":"Asia/Kolkata","flow":"","agent":"divya- d for Cowork","type":"app","agent":"aarav-mehta","flow":"command-centre-refresh","date":"2026-09-12","path":"tern-command-centre/dist/skills/tern-group.zip · command-centre.zip · .claude/skills/","url":"","summary":"Two uploadable skills so Max carries the 11 Sep org structure, the 100-person roster, the 89-skill catalogue and the command-centre conventions on Cowork, claude.ai, mobile and cloud sessions. Built by scripts/build-skills.js from this workspace; mirrored into the repo's .claude/skills for cloud sessions; copies placed in the MAX-PROJECT-PACK folder in Drive.","body":"# tern-group and command-centre skills packaged for Cowork\n\nGopakumar reported on 12 Sep that the new org structure and related skills were not available in Cowork on the Mac. Cause: Cowork loads only the skills enabled on the claude.ai account, never `tern-os/.claude/skills` or `~/.claude/skills` (see `docs/surfaces`). Fix: package the structure as an account skill.\n\n- `skill/tern-group/` — SKILL.md plus generated references (org tree, roster, skills catalogue, rules and cadence, where things live).\n- `skill/command-centre/` — unchanged conventions, now also zipped.\n- `scripts/build-skills.js` — regenerates the references, mirrors both into `.claude/skills/` at the repo root, writes `dist/skills/*.zip`.\n\nRemaining step for Gopakumar: upload the two zips once in the desktop app (Customize → Skills); tracked as sprint task `cowork-skills`."},{"id":"2026-09-12-edtech-team","title":"EdTech team under Jonas Weber (4 hires, 12 Sep)","type":"record","agent":"ananya-iyer","flow":"hire-or-reuse","date":"2026-09-12","path":"Tern Intelligence/employees/ROSTER.md · logs/HIRING-LOG.md · charter/ORG-CHART.md","url":"https://app.notion.com/p/3d9cac843da681d4a123d42df11dd423","summary":"Gopakumar's decision of 12 Sep — a team under Jonas Weber so FeatherQuest, Orbit and PrepShrep get proper shape and support. Four hires in Tern Academy, Jonas elevated to Head of EdTech; security and infrastructure stay reused from Tern Intelligence. Group headcount 104, balance 52 / 52.","body":"# EdTech team under Jonas Weber\n\nGopakumar decided on 12 Sep 2026 that Jonas Weber should have a team, so that FeatherQuest, Orbit and PrepShrep get better shape and support. Max had recommended waiting; Gopakumar's call stands and the records were updated the same day.\n\n**Reuse check (Ananya Iyer).** The group already carries the build skills, but every carrier is committed elsewhere: Aarav Mehta, Grace Liu and Lucas Meyer to Taurus and the group technology mandate; Sameer Rathi and Ines Fischer to regulated SaMD; Ethan Cole to product across four companies. Nobody carries board-grade AI content for Indian curricula or education product design full-time. **Verdict: hire four, reuse two.** Security (Arjun Khanna, Kabir Menon: PrepShrep Stage 1 code VA, RLS and API audits) and infrastructure (Aarav's team) stay with Tern Intelligence under the intercompany arrangement.\n\n| Hire | Role | Owns |\n|---|---|---|\n| Kavitha Ramanathan (F, Indian) | Curriculum & AI Content Lead | Board-pattern prompt tuning (CBSE, ICSE/ISC, Maharashtra), question-type variants, marking schemes; content gate with the seven teachers |\n| Tobias Lindgren (M, Swedish) | Mobile & Full-stack Engineer | PrepShrep React Native + FastAPI + Supabase, FeatherQuest, Orbit; launch backlog |\n| Hana Kobayashi (F, Japanese) | Product Designer & Growth Lead | UI/UX, app icon, store screenshots and listings, paywall, referral, launch campaign |\n| Pranav Bhatt (M, Indian) | QA, Release & Learning Analytics Engineer | Test automation, store releases, RevenueCat, push and email, learning-analytics dashboards |\n\n**Jonas Weber** becomes Head of EdTech & Learning Experience Design (lead of four), still reporting to Dr. Sunita Raghavan, Ethan Cole as practice sponsor. Tern Academy goes from 9 to 13; the group from 100 to 104; gender balance 52 / 52; names rotate Indian / global.\n\nStatus `paper` until Aarav Mehta creates the four tern-plugin agent files (sprint task `agent-files-edtech`)."},{"id":"2026-09-12-live-map","title":"Live map — animated view of the group","type":"app","agent":"aarav-mehta","flow":"command-centre-refresh","date":"2026-09-12","path":"tern-command-centre/app/index.html (Live panel)","url":"https://claude.ai/code/artifact/932a6090-6c9f-4d1c-81fe-f4e0bfa8252c#live","summary":"Canvas scene - every agent as a pixel avatar in its company district, flow packets between the agents of each run, cron rings on owners, tasks in flight; pause, speed, focus, hover, click.","body":"# Live map\n\nThe Live panel of the command centre. Districts for the Corporate Centre and the four companies; agents bob in place; packets travel the curves of every recorded run (green done, blue running); cron rings tick on their owners (red when a schedule needs attention); gold tickets count tasks in \"doing\". A ticker cycles through everything that has happened across runs. Works at phone width (2×2 districts) and respects reduced-motion settings."},{"id":"2026-09-12-notion-org-structure","title":"Tern Group — Org Structure in Notion (+ roster database)","type":"record","agent":"hannah-brooks","flow":"command-centre-refresh","date":"2026-09-12","path":"","url":"https://app.notion.com/p/3d9cac843da681d4a123d42df11dd423","summary":"Org page under Tern Intelligence in Notion with the full tree, practices, cadence, rules and open decisions; Tern Group Roster database with all 100 people; company rows for Tern Academy, Tern Animal Health and Tern Health & Research.","body":"# Tern Group — Org Structure in Notion\n\nCreated 12 Sep 2026 so the structure is readable by Max on every surface (mobile, Cowork, Mac) through the Notion connector. The roster database mirrors `employees/ROSTER.md`; the org page mirrors `charter/ORG-CHART.md`. Refresh both after any hire, promotion or transfer."},{"id":"2026-09-12-state-of-the-group-film","title":"State of the Group — film (Remotion)","type":"film","agent":"noah-bennett","flow":"command-centre-refresh","date":"2026-09-12","path":"tern-command-centre/video/out/tern-group-state.mp4","url":"","summary":"46-second 1080p film rendered from dist/state.json - intro, group board, Weekly Group Review pipeline, sprint board, needs attention & crons, outro.","body":"# State of the Group — film\n\nRendered with Remotion from the same export the artifact is built from. Six scenes: intro → group board (cards spring in, counts count up, avatars pop) → Weekly Group Review pipeline lighting step by step → sprint board → needs attention & crons → outro. `cd video && npm run render`. Re-render after every refresh so the film matches the workspace."},{"id":"2026-09-12-vault-refresh","title":"Obsidian vault refresh for Tern Group","type":"vault","agent":"hannah-brooks","flow":"command-centre-refresh","date":"2026-09-12","path":"Gopa Vault (Drive mirror) → Obsidian Sync","url":"","summary":"16 notes written or rewritten - areas for all four companies, Weekly Review project, Command Centre v2, Family, Health & Fitness, both indexes, Home.","body":"# Obsidian vault refresh for Tern Group\n\nNew: `02 Areas/Tern Academy`, `02 Areas/Tern Animal Health`, `02 Areas/Tern Health & Research`, `Projects/Tern Group — Weekly Review`.\n\nRewritten: `Home`, `02 Areas/_Areas Index`, `Projects/_Projects Index` (grouped by owning company), `02 Areas/Tern Group`, `02 Areas/Family`, `02 Areas/Health & Fitness`, `Projects/FeatherQuest`, `Projects/Orbit`, `Projects/Obsidian Second Brain`, `Projects/Tern OS Command Centre`."},{"id":"2026-09-11-org-chart","title":"ORG-CHART.md, ROSTER.md, HIRING-LOG.md (11 Sep)","type":"record","agent":"hannah-brooks","flow":"hire-or-reuse","date":"2026-09-11","path":"Tern Intelligence/charter/ORG-CHART.md · employees/ROSTER.md · logs/HIRING-LOG.md","url":"","summary":"The three records of truth for the group, rewritten the day Tern Group was formed.","body":"# ORG-CHART.md, ROSTER.md, HIRING-LOG.md\n\n- **ORG-CHART.md** — Gopakumar → Max → Corporate Centre (11) + Tern Intelligence (18) + Tern Academy (9) + Tern Animal Health (6) + Tern Health & Research (56) + Tern Ventures (0); 8 practices; cadence; rules.\n- **ROSTER.md** — 100 rows, #0 Max … #99 Emre Yilmaz, with Entity, Owns and Agent ID columns.\n- **HIRING-LOG.md** — every hire and promotion of 11 Sep with the reuse-before-hire check.\n\nThe `workspace/agents/` folder here is generated from ROSTER.md by `scripts/seed.js`."},{"id":"2026-09-11-tern-group-org-deck","title":"Tern Group — Org Structure (deck)","type":"deck","agent":"max","flow":"hire-or-reuse","date":"2026-09-11","path":"Tern Intelligence/charter/Tern-Group-Org-Structure.pptx","url":"","summary":"14-slide deck — chairman, Group MD, Corporate Centre, four companies, THR arms, practices, cadence, rules.","body":"# Tern Group — Org Structure (deck)\n\n14 slides, 16:9, Tern brand. One slide per company, three for Tern Health & Research (Healthcare, Research, MedTech), practices, reporting lines, the Weekly Group Review, the four safety rules and open decisions.\n\nBuilt with pptxgenjs; QA'd by rendering every slide. Delivered in chat on 11 Sep; not stored in Drive because of size — ask Max to regenerate from `charter/ORG-CHART.md` when the chart changes."},{"id":"2026-09-11-weekly-review-w37","title":"Weekly Group Review — 2026-W37 (baseline)","type":"report","agent":"max","flow":"weekly-group-review","date":"2026-09-11","path":"Tern Intelligence/charter/reviews/2026-W37-weekly-review.md","url":"","summary":"First report in the 15-section format. Headline - Tern Group formed; 56 THR hires on paper; Routine needs connectors; five decisions open.","body":"# Weekly Group Review — 2026-W37 (baseline)\n\nThe first report, written by hand on the day the group was formed, so the Monday run has something to compare against.\n\n- **Skills:** 89 skills; 44 agents (THR) have no domain skills yet — proposal: add vet, clinical, medical-device and regulatory skills.\n- **Utilization:** not yet measurable; every company has a first sprint task.\n- **People:** 56 hires and 2 promotions (Diego Santos → CEO, Sneha Pillai → COO) on 11 Sep.\n- **Finance:** no P&L yet; Priya Nair to propose intercompany charging.\n- **Decisions needed:** five (see docs/open-decisions)."}],"docs":[{"id":"how-agents-use-this","title":"How agents use this workspace","updated":"2026-09-12","tags":["conventions"],"body":"# How agents use this workspace\n\nThis folder is the shared memory of Tern Group. **Max and every agent read it and write to it; the dashboard only renders it.** Anything an agent needs to tell Gopakumar, or another agent, goes into a file here, in the format below. No file is ever edited by the dashboard except sprint tasks.\n\n## Folders\n\n| Folder | One file per | Format |\n|---|---|---|\n| `agents/` | person on the roster | Markdown with frontmatter: `name, role, company, arm, reports_to, lead, status (active · paper · idle), hired, skills: [ids], model` |\n| `skills/` | tern-os skill | Markdown with `name, summary, tags` |\n| `flows/` | repeatable workflow | JSON: `steps[]` (id, name, agent, kind, detail) and `runs[]` (id, status, steps[] with status · ms · note) |\n| `crons.json` | — | Array of schedules: `id, name, schedule (cron), human, tz, flow, agent, enabled, status, last_run, next_run, note` |\n| `generations/` | deliverable | Markdown with `title, type (deck · report · record · doc · app · vault), agent, flow, date, path, url, summary`; file name starts with the date |\n| `docs/` | reference page | Markdown; first heading is the title |\n| `sprints/` | sprint | JSON: `name, goal, start, end, tasks[]` with `id, title, owner (agent id), company, status (backlog · todo · doing · done), priority, due, notes` |\n| `links.json` | — | Array of `group, title, url, note` |\n\n## Rules for writing\n\n1. **Ids are slugs** of names: `dr.` dropped, lower-case, hyphens (`Dr. Rekha Iyengar` → `rekha-iyengar`). `Gopakumar` is `gopakumar`.\n2. **A flow run is appended, never rewritten.** Update a step's `status` (pending · running · done · failed · skipped) and `note` as you go.\n3. **Every deliverable gets a generation** the moment it exists, with the `flow` and `agent` that produced it.\n4. **A new hire is not done until** `agents/<id>.md` exists with `status: paper`, and turns `active` only when the tern-plugin agent file exists.\n5. **Sprint tasks are the only thing the dashboard writes.** Agents may also edit the sprint JSON directly; keep ids stable.\n6. **Safety rules travel with the agent file** (Healthcare, Animal Health, Research, MedTech). Do not remove them.\n\n## Refresh cycle\n\n`node scripts/seed.js` regenerates agents and skills from `scripts/roster-data.json` (export of ROSTER.md). `node build-static.js` exports `dist/index.html`; Max publishes that to the artifact link."},{"id":"open-decisions","title":"Open decisions for Gopakumar","updated":"2026-09-12","tags":["decisions"],"body":"# Open decisions for Gopakumar\n\n| # | Decision | Max's recommendation | Since |\n|---|---|---|---|\n| 1 | Confirm Diego Santos as CEO, Tern Intelligence and Sneha Pillai as COO | Confirm both; both were acting in the role | 11 Sep |\n| 2 | Dr. Meghna Raman over Dr. Hiroshi Nakamura to lead MedTech | Meghna — commercial and regulatory breadth; Hiroshi leads Device R&D | 11 Sep |\n| 3 | Reading of \"Advanced Medicine\" | Advanced & precision medicine (genomics, targeted therapy) under Medical Specialties | 11 Sep |\n| 4 | Marathi as Aarshi's third language | Yes; Manoj Deshpande already covers Hindi & Marathi | 11 Sep |\n| 5 | A private Family Health log in Notion for the desk | Yes, restricted page; no clinical detail beyond what you approve | 11 Sep |\n\nSay the number and \"yes\", \"no\" or your change; Max updates the records the same day.\n\n## Decided\n\n| Date | Decision | Outcome |\n|---|---|---|\n| 12 Sep | A team under Jonas Weber so FeatherQuest, Orbit and PrepShrep get shape and support | Gopakumar: yes (Max had recommended waiting). Four hires the same day: Kavitha Ramanathan, Tobias Lindgren, Hana Kobayashi, Pranav Bhatt; Jonas elevated to Head of EdTech. Group 104, balance 52 / 52. |"},{"id":"org-structure","title":"Tern Group — org structure","updated":"2026-09-12","tags":["org"],"body":"# Tern Group — org structure\n\n**Gopakumar** — Founder, Owner & Chairman\n→ **Max** — Group Managing Director (`tern:max`), single point of contact\n\nGroup headcount 104 (Max + 103) as of 12 Sep 2026; balance 52 / 52.\n\n## Group Corporate Centre (11)\nHannah Brooks (Chief of Staff) · Priya Nair (Group CFO) · Vikram Desai (Group GC; Amara Okonkwo) · Ananya Iyer (Group CHRO) · Kavya Reddy (Research & Strategy) · Sofia Rossi (Group CMO; Riya Malhotra) · Maya Lindqvist (Content; Noah Bennett)\n\n## Operating companies\n- **Tern Intelligence (18)** — Diego Santos, CEO. Aarav Mehta (CTO), Sneha Pillai (COO), Rohan Kapoor (Sales & BD), Ethan Cole (CPDO), Liam O'Brien (Data & Automation) and teams.\n- **Tern Academy (13)** — Dr. Sunita Raghavan, CEO & Principal. Seven ICSE subject teachers + the EdTech team under Jonas Weber (Head of EdTech): Kavitha Ramanathan (curriculum & AI content), Tobias Lindgren (mobile & full-stack), Hana Kobayashi (product design & growth), Pranav Bhatt (QA, release & learning analytics). Products: FeatherQuest, Orbit, PrepShrep.\n- **Tern Animal Health (6)** — Dr. Nandini Bhat, CEO & CVO. Vet, avian nutrition, behaviour, segment programme, veterinary nurse.\n- **Tern Health & Research (56)** — Dr. Vidya Krishnamurthy, CEO.\n  - Healthcare (25) — Dr. Rekha Iyengar, CMO: Family Health Desk, Primary & Emergency, Medical Specialties, Mental Health & Rehab, Diagnostics & Pharmacy & Dental.\n  - Research (16) — Dr. Samuel Adeyemi, CSO: Digital Health & AI, Medicine & Clinical Research, Disease & Epidemiology, Pharmacology, Biostatistics.\n  - MedTech (12) — Dr. Meghna Raman, CMTO: Device R&D, SaMD, Regulatory & Quality, Clinical Validation, Product, Manufacturing.\n  - Shared — Dr. Radhika Subramaniam (Regulatory, Ethics & Governance), Nisha Patel (Operations).\n- **Tern Ventures (0)** — held at Group: Aarshi.in, e-Source Consultancy, Strings & Wings.\n\n## Practices (8)\nInsurance · AI Delivery · Security & Infrastructure · Contact-Centre Operations · EdTech · Pet & Animal Health · MedTech & Digital Health · Group Health & Wellbeing. Each has an executive sponsor and a practice lead; members keep their line manager.\n\nSource of truth: `Tern Intelligence/charter/ORG-CHART.md`. The Org view of this dashboard is generated from `workspace/agents/`."},{"id":"review-cadence","title":"Review cadence","updated":"2026-09-11","tags":["cadence"],"body":"# Review cadence\n\n## Weekly Group Review — Monday 08:00 IST\nChaired by Max. One report to Gopakumar in a fixed order:\n\n1. Headline — three lines Gopakumar must know\n2. Skills review — every agent Fit / Stretch / Gap → Keep / Update / Upgrade / Absorb / Hire; upgrades made this week\n3. Utilization — per company and per person\n4. Tasks completed\n5. Tasks ongoing (owner, due date, blocker)\n6. Recurring tasks — ran / missed\n7. Skill upgrades and new skills installed in tern-os\n8. New hires (with reuse-before-hire check)\n9. Promotions and transfers\n10. New ventures and pipeline\n11. Financial report — company P&Ls, intercompany charging, tool spend\n12. Family services — Academy, Animal Health, Family Health Desk\n13. Risks, compliance and safety-rule adherence\n14. Decisions needed from Gopakumar\n15. Next week's plan\n\n## Other rhythms\n- **Weekly:** WBR per Taurus site; HDFC Ergo reviews Tue & Fri 15:00; Family Health Desk check-in; Aarshi's study plan (Saturday/Sunday); Pluto & Bannu check (Saturday).\n- **Monthly:** CEO business reviews with Max; family reviews (Aarshi, pets, family health) with Gopakumar.\n- **Quarterly:** group review with Gopakumar; MedTech regulatory & pipeline review.\n\nFiles: `charter/REVIEW-CADENCE.md`, `charter/reviews/WEEKLY-REPORT-TEMPLATE.md`, `charter/reviews/ROUTINE-PROMPT-weekly-review.md`."},{"id":"rules","title":"Rules every agent carries","updated":"2026-09-11","tags":["rules","safety"],"body":"# Rules every agent carries\n\n## Safety\n- **Healthcare** supports care and prepares the family for the doctor. It never replaces a licensed physician: no diagnosis, no prescribing. Emergencies → **112 / 108** first.\n- **Animal Health** advises and prepares. Any acute sign in Pluto or Bannu (fluffed, tail-bobbing, off food, bleeding, laboured breathing) → **same-day licensed avian vet in Pune**.\n- **Research** is advisory only. Ethics approval before any human-subject study. Every claim cited.\n- **MedTech** concepts stay research-grade until a regulatory pathway (CDSCO / FDA / CE) and a risk file exist.\n\n## Organisation\n- Everyone has exactly one line manager. Practices are matrix teams: an executive sponsor, a practice lead, members keep their line.\n- **Reuse before hire.** A new role needs a reuse check by the Group CHRO.\n- Every hire, promotion and transfer updates `ROSTER.md`, `HIRING-LOG.md` and `ORG-CHART.md` the same day, and gets an agent file.\n- Gender balance stays 50 / 50; names rotate Indian / global.\n\n## Working with Gopakumar\n- Max is the single voice. Companies report to Max; Max reports to Gopakumar.\n- Decisions above a role are escalated, never assumed. Open decisions are listed in `docs/open-decisions` and section 14 of the weekly report."},{"id":"surfaces","title":"Where Max runs and what each surface loads","updated":"2026-09-12","tags":["conventions","surfaces","cowork"],"body":"# Where Max runs and what each surface loads\n\nThe org structure and the tern-os skills are files. Each surface Max runs on reads a different set of files, so \"it exists\" is not the same as \"Max can see it here\". This is the map.\n\n| Surface | Skills it loads | Sees the Tern OS folder? | How the org structure reaches it |\n|---|---|---|---|\n| **Claude Code on the Mac** (Tern OS folder open) | `tern-os/.claude/skills/*` (all 89), `tern-plugin` agents, `~/.claude/skills` | Yes | ORG-CHART.md, ROSTER.md, the command-centre workspace, the `command-centre` skill |\n| **Cowork on the Mac** (Desktop app, Cowork tab) | **Only skills and plugins enabled for the claude.ai account** (Desktop sidebar → Customize, or claude.ai → Settings → Capabilities → Skills). It does **not** read `~/.claude/skills` or a project's `.claude/skills` | Only the folder picked for the session, as plain files | The `tern-group` skill (uploaded once), the Notion org page via the Notion connector, and the Tern OS folder if it is picked for the session |\n| **claude.ai / iPhone** (project \"Max — Tern Group\") | Account skills; no plugin skills | No | Project instructions + `COMPANY-CONTEXT.md`, `ROSTER.md` in the MAX-PROJECT-PACK; the `tern-group` skill |\n| **Cloud sessions and Routines** (claude.ai/code, Weekly Group Review) | Account skills **plus** `.claude/skills/` committed in the cloned repo | The repo only | `.claude/skills/tern-group` and `.claude/skills/command-centre` in `gopakumarpm/todoist-notion-sync`; Drive and Notion connectors |\n\n## Why the new org structure was missing in Cowork\n\nCowork does not run the tern-plugin and does not load `tern-os/.claude/skills`. The only skills it had were the ones enabled on the claude.ai account (teacher, legal-advisor, bd-consultant, remotion, data-report-generator and the Anthropic examples), none of which carry the 11 Sep structure. The Notion org page is reachable, but only if Max is told to look there.\n\n## The fix (two uploads, once)\n\n1. Get the zips: `tern-command-centre/dist/skills/tern-group.zip` and `command-centre.zip` (regenerate with `node scripts/build-skills.js`; also copied to the MAX-PROJECT-PACK folder in Drive).\n2. Claude desktop app → sidebar **Customize** → **Skills** → add / upload → pick `tern-group.zip`; repeat for `command-centre.zip`. The same page exists at claude.ai → Settings → Capabilities → Skills.\n3. Start a new Cowork session. Both skills are synced at session start; ask Max \"who owns X?\" or \"refresh the command centre\" to confirm.\n4. Optional: pick the Tern OS folder as the Cowork session folder so Max can also read `tern-command-centre/workspace/` and the full skill bodies as files.\n\n## What the `tern-group` skill carries\n\n`SKILL.md` (routing, companies, front doors, rules) and `references/`: `org-structure.md`, `roster.md` (100 rows), `skills-catalogue.md` (89 skills and carriers), `rules-and-cadence.md`, `where-things-live.md`. All generated from this workspace, so a roster change is: `seed.js` → `build-skills.js` → re-upload the zip. Until the zip is re-uploaded, Cowork keeps the previous version.\n\n## Not fixed by this\n\nThe 89 tern-os skill **bodies** still run only in Claude Code with the Tern OS folder open. In Cowork Max works from the one-line summary and the carrier's mandate, or reads the SKILL.md as a file if the folder is picked. Uploading each of the 89 as an account skill is possible but is a separate decision (Ananya Iyer to propose the first five in the weekly review)."}],"sprints":[{"id":"2026-S37","tasks":[{"id":"cowork-skills","title":"Upload tern-group.zip and command-centre.zip in the desktop app (Customize → Skills) so Cowork sees the org structure","owner":"gopakumar","company":"Group","status":"todo","priority":"P0","due":"2026-09-13","notes":"Zips in tern-command-centre/dist/skills and in Drive MAX-PROJECT-PACK. Then start a new Cowork session and ask Max \"who owns X?\". Why: Cowork loads only account skills — docs/surfaces."},{"id":"agent-files-thr","title":"Create the 56 THR agent files in tern-plugin/agents and refresh the plugin","owner":"aarav-mehta","company":"Tern Intelligence","status":"todo","priority":"P0","due":"2026-09-13","notes":"Specs are the agents/*.md files with status: paper. Restart Claude after the plugin refresh."},{"id":"routine-with-connectors","title":"Recreate the Weekly Group Review Routine with os","company":"Tern Intelligence","status":"backlog","priority":"P1","due":"","notes":"Top company blocker since April."},{"id":"skills-gap-clinical","title":"Add vet, clinical, medical-device and regulatory skills to tern-os","owner":"ananya-iyer","company":"Group","status":"backlog","priority":"P2","due":"","notes":"44 agents currently run on research and domain files only. Weekly review to propose the first five."},{"id":"tern-group-formed","title":"Form Tern Group: Corporate Centre, four companies, 8 practices, 100 people","owner":"max","company":"Group","status":"done","priority":"P0","due":"2026-09-11","notes":"ORG-CHART.md, ROSTER.md, HIRING-LOG.md updated same day."},{"id":"review-cadence","title":"Set the Weekly Group Review cadence, template and baseline report","owner":"hannah-brooks","company":"Group","status":"done","priority":"P0","due":"2026-09-11","notes":"REVIEW-CADENCE.md, WEEKLY-REPORT-TEMPLATE.md, 2026-W37-weekly-review.md."},{"id":"org-deck","title":"Tern Group org-structure deck (14 slides)","owner":"max","company":"Group","status":"done","priority":"P1","due":"2026-09-11","notes":"Tern-Group-Org-Structure.pptx"},{"id":"vault-refresh","title":"Refresh the Obsidian vault for Tern Group (areas, projects, indexes)","owner":"hannah-brooks","company":"Group","status":"done","priority":"P1","due":"2026-09-12","notes":"16 notes written or rewritten."},{"id":"command-centre-v2","title":"Command Centre v2 and this file-based workspace","owner":"max","company":"Group","status":"done","priority":"P1","due":"2026-09-12","notes":"tern-command-centre/ — server, workspace, static export."}],"name":"Sprint 37 — Tern Group stands up","goal":"Every hire is runnable, the weekly review runs on its own, and Gopakumar's five decisions are closed.","start":"2026-09-08","end":"2026-09-14","columns":["backlog","todo","doing","done"]}],"links":[{"group":"Command centre","title":"Tern OS Command Centre (published snapshot)","url":"https://claude.ai/code/artifact/932a6090 function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return h;}

// ---------- tiny markdown ----------
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/→/g,'→');}
function md(src){const out=[];const lines=src.split(/\r?\n/);let i=0;
  while(i<lines.length){let l=lines[i];
    if(/^```/.test(l)){const buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))buf.push(lines[i++]);i++;out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);continue;}
    if(/^\|/.test(l)){const rows=[];while(i<lines.length&&/^\|/.test(lines[i]))rows.push(lines[i++]);const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(rows[0]);const body=rows.slice(rows[1]&&/^\|?\s*-/.test(rows[1])?2:1);out.push(`<table><thead><tr>${head.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${cells(r).map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);continue;}
    const h=l.match(/^(#{1,3})\s+(.*)/);if(h){out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);i++;continue;}
    if(/^---+$/.test(l.trim())){out.push('<hr>');i++;continue;}
    if(/^>\s?/.test(l)){const buf=[];while(i<lines.length&&/^>\s?/.test(lines[i]))buf.push(lines[i++].replace(/^>\s?/,''));out.push(`<blockquote>${inline(buf.join(' '))}</blockquote>`);continue;}
    if(/^\s*[-*]\s+/.test(l)){const buf=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i]))buf.push(lines[i++].replace(/^\s*[-*]\s+/,''));out.push(`<ul>${buf.map(x=>`<li>${inline(x)}</li>`).join('')}</ul>`);continue;}
    if(/^\s*\d+\.\s+/.test(l)){const buf=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i]))buf.push(lines[i++].replace(/^\s*\d+\.\s+/,''));out.push(`<ol>${buf.map(x=>`<li>${inline(x)}</li>`).join('')}</ol>`);continue;}
    if(!l.trim()){i++;continue;}
    const buf=[];while(i<lines.length&&lines[i].trim()&&!/^(#{1,3}\s|```|\||>|\s*[-*]\s|\s*\d+\.\s|---+$)/.test(lines[i]))buf.push(lines[i++]);out.push(`<p>${inline(buf.join(' '))}</p>`);}
  return out.join('');}

function liveStop(){if(live){cancelAnimationFrame(live.raf);removeEventListener('resize',live.onResize);live=null;}}
function liveStart(){const cv=$('live');if(!cv)return;const ctx=cv.getContext('2d');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ARM=['Shared','Healthcare','Research','MedTech'];
  const sprite=(id,color)=>{const c=document.createElement('canvas');c.width=8;c.height=8;const x=c.getContext('2d');x.fillStyle=color;avatarCells(id).forEach(([a,b])=>x.fillRect(a,b,1,1));x.fillStyle='#0A1523';x.fillRect(2,3,1,1);x.fillRect(5,3,1,1);return c;};
  const nodes={};let W=0,H=0,DPR=1,districts=[];
  function layout(){const r=cv.parentElement.getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(devicePixelRatio||1,2);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);districts=[];
    const put=(a,x,y,r)=>{const c=CO(a.company)||{color:'#8FA3BC'};const col=a.arm&&c.arms&&c.arms[a.arm]?c.arms[a.arm]:c.color;nodes[a.id]={a,x,y,r,color:col,img:nodes[a.id]?.img||sprite(a.id,col),phase:hash(a.id)%628/100};};
    const cc=S.agents.filter(a=>a.company==='Group');const max=A('max');const topH=Math.max(130,H*.24);
    if(max)put(max,W/2,52,15);const others=cc.filter(a=>a.id!=='max');const gap=Math.min(52,(W-60)/Math.max(1,others.length));others.forEach((a,i)=>put(a,W/2+(i-(others.length-1)/2)*gap,topH-34,W<620?9:11));
    districts.push({key:'Group',x:12,y:8,w:W-24,h:topH-8,color:(CO('Group')||{}).color});
    const cos=S.companies.filter(c=>c.key!=='Group');const narrow=W<620;const y0=topH+8,dh=H-y0-12;
    // district boxes: one row of four on desktop, a 2x2 grid on phones
    let boxes=[];if(!narrow){const weights=cos.map(c=>Math.max(1.2,Math.sqrt(S.agents.filter(a=>a.company===c.key).length)));const tw=weights.reduce((a,b)=>a+b,0);let x=12;cos.forEach((c,i)=>{const dw=(W-24-(cos.length-1)*10)*weights[i]/tw;boxes.push({c,x,y:y0,w:dw,h:dh});x+=dw+10;});}
    else{const cnt=c=>S.agents.filter(a=>a.company===c.key).length;const rowsW=[Math.max(cnt(cos[0]),cnt(cos[1])),Math.max(cnt(cos[2]),cnt(cos[3]))].map(n=>Math.sqrt(n));const th=rowsW[0]+rowsW[1];const dw=(W-24-10)/2;let y=y0;[[0,1],[2,3]].forEach((pair,ri)=>{const h=(dh-10)*rowsW[ri]/th;pair.forEach((ci,k)=>{if(cos[ci])boxes.push({c:cos[ci],x:12+k*(dw+10),y,w:dw,h});});y+=h+10;});}
    boxes.forEach(({c,x,y,w:dw,h:bh})=>{districts.push({key:c.key,x,y,w:dw,h:bh,color:c.color});
      const ppl=S.agents.filter(a=>a.company===c.key).sort((p,q)=>(p.lead?0:1)-(q.lead?0:1)||ARM.indexOf(p.arm)-ARM.indexOf(q.arm)||p.name.localeCompare(q.name));const n=ppl.length;
      const iw=dw-20,ih=bh-44;let cols=Math.max(1,Math.round(Math.sqrt(n*iw/ih)));let rows=Math.ceil(n/cols);let s=Math.min(46,iw/cols,ih/rows);cols=Math.max(1,Math.min(n,Math.floor(iw/s)));rows=Math.ceil(n/cols);
      const ox=x+10+(iw-cols*s)/2+s/2,oy=y+36+s/2;ppl.forEach((a,k)=>put(a,ox+(k%cols)*s,oy+Math.floor(k/cols)*s,a.lead?Math.min(15,s*.36):Math.min(12,s*.3)));});}
  const runs=S.flows.map(f=>{const r=f.runs.find(x=>x.status==='running')||f.runs[0];if(!r)return null;const path=f.steps.map(s=>s.agent).filter(id=>nodes[id]||A(id));const cur=f.steps.findIndex(s=>{const st=r.steps.find(x=>x.id===s.id);return !st||st.status!=='done';});return {f,r,path,cur:cur<0?f.steps.length-1:cur,done:r.status==='done',phase:hash(f.id)%1000/1000};}).filter(Boolean);
  const events=[];S.flows.forEach(f=>f.runs.forEach(r=>r.steps.forEach(s=>{if(s.note)events.push([f.name,nameOf((f.steps.find(x=>x.id===s.id)||{}).agent),(f.steps.find(x=>x.id===s.id)||{}).name,s.note,s.status]);})));S.crons.filter(c=>c.enabled).forEach(c=>events.push(['cron',nameOf(c.agent),c.name,'next '+(c.next_run||'—'),'pending']));
  const doing={};(S.sprints[0]||{tasks:[]}).tasks.filter(t=>t.status==='doing').forEach(t=>{doing[t.owner]=(doing[t.owner]||0)+1;});
  const cronBy={};S.crons.forEach(c=>{(cronBy[c.agent]=cronBy[c.agent]||[]).push(c);});
  live={raf:0,t:0,last:performance.now(),hover:null,ev:-1,onResize:layout};layout();
  const curve=(p,q)=>({cx:(p.x+q.x)/2,cy:Math.min(p.y,q.y)-Math.min(90,Math.abs(q.x-p.x)*.35+20)});
  const bez=(p,q,t)=>{const c=curve(p,q);const u=1-t;return [u*u*p.x+2*u*t*c.cx+t*t*q.x,u*u*p.y+2*u*t*c.cy+t*t*q.y];};
  function frame(now){const dt=Math.min(50,now-live.last);live.last=now;if(!LIVE.paused&&!reduced)live.t+=dt*LIVE.speed;const t=live.t;ctx.clearRect(0,0,W,H);
    const dimCo=k=>LIVE.focus&&LIVE.focus!==k;
    districts.forEach(d=>{ctx.globalAlpha=dimCo(d.key)?.35:1;ctx.fillStyle='#0C1B2E';ctx.strokeStyle='#172C45';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(d.x,d.y,d.w,d.h,8);ctx.fill();ctx.stroke();ctx.fillStyle=d.color;ctx.fillRect(d.x+8,d.y,Math.max(0,d.w-16),2);
      const c=CO(d.key)||{};ctx.fillStyle='#8FA3BC';ctx.font='700 9.5px Montserrat';ctx.textAlign='left';ctx.fillText((c.short||d.key).toUpperCase().split('').join(' '),d.x+10,d.y+16);ctx.font='500 10px JetBrains Mono';ctx.fillStyle='#5B7089';ctx.fillText(S.agents.filter(a=>a.company===d.key).length+' · '+(nameOf(c.head)||''),d.x+10,d.y+29);});
    if(W>=620){ctx.globalAlpha=1;ctx.fillStyle='#5B7089';ctx.font='600 9px Montserrat';ctx.textAlign='center';ctx.fillText((S.chairman||'').toUpperCase()+' · CHAIRMAN',W/2,20);}
    if(LIVE.flows){runs.forEach(run=>{for(let i=0;i<run.path.length-1;i++){const p=nodes[run.path[i]],q=nodes[run.path[i+1]];if(!p||!q)continue;const c=curve(p,q);ctx.globalAlpha=(dimCo(p.a.company)||dimCo(q.a.company))?.08:(i<run.cur?.32:.14);ctx.strokeStyle=i<run.cur?'#5FA86A':i===run.cur?'#4A8FD6':'#5B7089';ctx.lineWidth=1.2;ctx.setLineDash(i<run.cur?[]:[3,4]);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(c.cx,c.cy,q.x,q.y);ctx.stroke();}});ctx.setLineDash([]);}
    ctx.globalAlpha=1;Object.values(nodes).forEach(n=>{const bob=reduced?0:Math.sin(t/700+n.phase)*1.6;const y=n.y+bob;const dim=dimCo(n.a.company);ctx.globalAlpha=dim?.25:(n.a.status==='paper'?.55:1);
      if(n.a.status==='paper'){ctx.strokeStyle=n.color;ctx.setLineDash([2,3]);ctx.lineWidth=1;ctx.beginPath();ctx.arc(n.x,y,n.r+4,0,7);ctx.stroke();ctx.setLineDash([]);}
      if(LIVE.crons&&cronBy[n.a.id]&&!dim){const bad=cronBy[n.a.id].some(c=>!c.enabled||!['ok','new'].includes(c.status));ctx.strokeStyle=bad?'#D07A8E':'#C9A43E';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(n.x,y,n.r+6,-Math.PI/2,-Math.PI/2+(reduced?4.7:(t/2400)%(Math.PI*2)));ctx.stroke();ctx.globalAlpha*=.35;ctx.beginPath();ctx.arc(n.x,y,n.r+6,0,7);ctx.stroke();ctx.globalAlpha=dim?.25:1;}
      const s=n.r*2;ctx.imageSmoothingEnabled=false;ctx.drawImage(n.img,n.x-s/2,y-s/2,s,s);
      if(n.a.lead&&(W>=620||n.a.id==='max'||n.a.reports_to==='max'&&n.a.company!=='Group')){ctx.fillStyle='#8FA3BC';ctx.font=(n.a.id==='max'?'700 10px':'500 9px')+' Inter';ctx.textAlign='center';ctx.fillText(n.a.name.replace(/^Dr\.\s*/,'').split(' ')[0],n.x,y+n.r+11);}
      if(LIVE.tasks&&doing[n.a.id]&&!dim){const k=doing[n.a.id];const ty=y-n.r-9+(reduced?0:Math.sin(t/500+n.phase)*1.2);ctx.fillStyle='#C9A43E';ctx.beginPath();ctx.roundRect(n.x-6,ty-4,12,8,2);ctx.fill();ctx.fillStyle='#0A1523';ctx.font='700 7px JetBrains Mono';ctx.textAlign='center';ctx.fillText(k,n.x,ty+2.5);}
      if(n===live.hover){ctx.strokeStyle='#E8EDF4';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(n.x,y,n.r+3,0,7);ctx.stroke();}});
    if(LIVE.flows){runs.forEach(run=>{if(run.path.length<2)return;const segs=run.done?run.path.length-1:Math.max(1,run.cur);const prog=reduced?segs-0.001:((t/1500)*1+run.phase*segs)%segs;const i=Math.floor(prog),f=prog-i;const p=nodes[run.path[i]],q=nodes[run.path[Math.min(i+1,run.path.length-1)]];if(!p||!q)return;const [x,y]=bez(p,q,f);
      const col=run.done?'#5FA86A':'#4A8FD6';ctx.globalAlpha=(dimCo(p.a.company))?.15:(run.done?.55:1);const g=ctx.createRadialGradient(x,y,0,x,y,10);g.addColorStop(0,col);g.addColorStop(1,col+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fill();ctx.fillStyle='#E8EDF4';ctx.beginPath();ctx.arc(x,y,2.2,0,7);ctx.fill();
      if(!run.done){const c=nodes[run.path[run.cur]];if(c){const pulse=reduced?0:(Math.sin(t/300)+1)*3;ctx.strokeStyle='#4A8FD6';ctx.globalAlpha=.8;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(c.x,c.y,c.r+8+pulse,0,7);ctx.stroke();}}});}
    ctx.globalAlpha=1;const ev=Math.floor(t/3200)%Math.max(1,events.length);if(ev!==live.ev&&events.length){live.ev=ev;const e=events[ev];const tk=$('ticker');if(tk)tk.innerHTML=`<i style="background:${ST[e[4]]||'var(--gold)'}"></i><span><b>${esc(e[1])}</b> · ${esc(e[2])} <span style="color:var(--faint)">(${esc(e[0])})</span> — ${esc(e[3])}</span>`;}
    live.raf=requestAnimationFrame(frame);}
  cv.onpointermove=e=>{const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=400;Object.values(nodes).forEach(n=>{const d=(n.x-mx)**2+(n.y-my)**2;if(d<bd&&d<(n.r+8)**2){bd=d;best=n;}});live.hover=best;const tip=$('ltip');
    if(best){tip.style.display='block';tip.innerHTML=`<small>${esc((CO(best.a.company)||{}).short||'')}${best.a.arm&&best.a.arm!=='Shared'?' · '+esc(best.a.arm):''}${best.a.status==='paper'?' · on paper':''}</small>${esc(best.a.name)}<br><span style="color:var(--dim);font-size:11px">${esc(best.a.role)}</span>`;tip.style.left=Math.min(mx+14,W-270)+'px';tip.style.top=(my+12)+'px';cv.style.cursor='pointer';}else{tip.style.display='none';cv.style.cursor='crosshair';}};
  cv.onpointerleave=()=>{live.hover=null;$('ltip').style.display='none';};cv.onclick=()=>{if(live.hover)D.agent(live.hover.a.id);};
  addEventListener('resize',live.onResize);live.raf=requestAnimationFrame(frame);}

// ---------- search ----------
function hits(){const h=[];const m=s=>String(s||'').toLowerCase().includes(query);
  S.agents.forEach(a=>{if(m(a.name+' '+a.role+' '+a.company+' '+a.arm+' '+a.skills.join(' ')))h.push(['agent',a.id,a.name,a.role,coColor(a.company)]);});
  S.skills.forEach(s=>{if(m(s.name+' '+s.summary))h.push(['skill',s.id,s.name,s.summary,'var(--gold)']);});
  S.flows.forEach(f=>{if(m(f.name+' '+f.description))h.push(['flow',f.id,f.name,f.description,'var(--run)']);});
  S.crons.forEach(c=>{if(m(c.name+' '+c.note))h.push(['cron',c.id,c.name,c.human,'var(--wait)']);});
  S.generations.forEach(g=>{if(m(g.title+' '+g.summary+' '+g.body))h.push(['gen',g.id,g.title,g.summary,'var(--gold-soft)']);});
  S.docs.forEach(d=>{if(m(d.title+' '+d.body))h.push(['doc',d.id,d.title,'doc','var(--blue-soft)']);});
  (S.sprints[0]||{tasks:[]}).tasks.forEach(t=>{if(m(t.title+' '+t.notes+' '+t.owner))h.push(['task',t.id,t.title,t.status+' · '+nameOf(t.owner),PRI[t.priority]]);});
  return h;}
const countHits=()=>hits().length;
function renderSearch(){return `<ul class="list">${hits().slice(0,80).map(h=>`<li><button data-act="${h[0]}" data-id="${esc(h[1])}"><span class="dot" style="background:${h[4]}"></span><span><b>${esc(h[2])}</b><span class="sub">${esc(h[3])}</span></span><span class="mono" style="font-size:10px;color:var(--faint)">${h[0]}</span></button></li>`).join('')||'<li class="sub">No matches.</li>'}</ul>`;}

// ---------- detail ----------
function show(html){detail.innerHTML=`<button class="close" data-act="close">close</button><div class="eyebrow">Details</div>`+html;detail.classList.add('open');markSel();}
const lnk=(act,id,b,s)=>`<button class="lnk" data-act="${act}" data-id="${esc(id)}">${act==='agent'?face(id,16):''}<b>${esc(b)}</b><span>${esc(s||'')}</span></button>`;
const D={};
D.agent=id=>{const a=A(id);if(!a)return;sel={kind:'agent',id};const c=CO(a.company)||{};
  show(`<span class="kind">${a.lead?'Leadership':'Agent'} · ${esc(c.short||a.company)}${a.arm&&a.arm!=='Shared'?' · '+esc(a.arm):''}</span><div class="hero">${avatar(a.id,c.color||'#8FA3BC',56)}<div><div class="name">${esc(a.name)}</div><div class="meta">${esc(a.id)} · model ${esc(a.model||'—')} · <span style="color:${a.status==='paper'?'var(--wait)':'var(--ok)'}">${esc(a.status)}</span>${a.hired?' · hired '+esc(a.hired):''}</div></div></div>
  <div class="md">${md(a.body.replace(/^#\s.*\n/,""))}</div>
  <div class="sec"><h4>Reports to</h4>${a.reports_to==='gopakumar'?`<div class="lnk"><b>Gopakumar</b><span>Founder, Owner & Chairman</span></div>`:lnk('agent',a.reports_to,nameOf(a.reports_to),(A(a.reports_to)||{}).role)}</div>
  ${a.reports.length?`<div class="sec"><h4>Direct reports · ${a.reports.length}</h4>${a.reports.map(r=>lnk('agent',r,nameOf(r),(A(r)||{}).role)).join('')}</div>`:''}
  <div class="sec"><h4>Skills · ${a.skills.length}</h4>${a.skills.map(s=>lnk('skill',s,s,(S.skills.find(x=>x.id===s)||{}).summary)).join('')||'<span class="empty">None yet — flagged for the weekly skills review.</span>'}</div>
  <div class="sec"><h4>Company</h4>${lnk('co',a.company,c.name||a.company,(S.agents.filter(x=>x.company===a.company).length)+' people')}</div>`);};
D.co=key=>{const c=CO(key);if(!c)return;sel={kind:'co',id:key};const ppl=S.agents.filter(a=>a.company===key);const leads=ppl.filter(a=>a.lead);
  show(`<span class="kind">Company</span><div class="name">${esc(c.name)}</div><div class="meta">${ppl.length} people · ${ppl.filter(a=>a.status==='paper').length} on paper · head ${esc(nameOf(c.head))}, ${esc(c.title)}</div><div class="md"><p>${esc(c.blurb||'')}</p></div>
  ${c.arms?`<div class="sec"><h4>Arms</h4>${Object.entries(c.arms).map(([a,col])=>`<div class="lnk"><span class="dot" style="background:${col}"></span><b>${esc(a)}</b><span>${ppl.filter(x=>x.arm===a).length} people</span></div>`).join('')}</div>`:''}
  <div class="sec"><h4>Leadership</h4>${leads.map(a=>lnk('agent',a.id,a.name,a.role)).join('')}</div><div class="sec">${lnk('agentsco',key,'Open all '+ppl.length+' in Agents','')}</div>`);};
D.skill=id=>{const s=S.skills.find(x=>x.id===id);if(!s)return;sel={kind:'skill',id};show(`<span class="kind">Skill · tern-os</span><div class="name">${esc(s.name)}</div><div class="meta">.claude/skills/${esc(s.id)} · updated ${esc(s.updated)}</div><div class="md">${md(s.body.replace(/^#\s.*\n/,""))}</div><div class="sec"><h4>Carried by · ${s.used_by.length}</h4>${s.used_by.map(a=>lnk('agent',a,nameOf(a),(A(a)||{}).role)).join('')||'<span class="empty">Nobody yet.</span>'}</div>`);};
D.step=key=>{const [fid,sid]=key.split('|');const f=S.flows.find(x=>x.id===fid);const s=f&&f.steps.find(x=>x.id===sid);if(!s)return;const run=f.runs.find(r=>r.id===runId);const st=run&&run.steps.find(x=>x.id===sid);sel={kind:'step',id:key};
  show(`<span class="kind">Flow step · ${esc(f.name)}</span><div class="name">${esc(s.name)}</div><div class="meta">${esc(s.kind)} · ${run?esc(run.name||run.id):'no run'} · <span style="color:${ST[(st||{}).status]||'var(--dim)'}">${esc((st||{}).status||'pending')}</span></div><div class="md"><p>${esc(s.detail||'')}</p>${st&&st.note?`<blockquote>${esc(st.note)}</blockquote>`:''}</div><div class="sec"><h4>Agent</h4>${lnk('agent',s.agent,nameOf(s.agent),(A(s.agent)||{}).role)}</div>`);};
D.cron=id=>{const c=S.crons.find(x=>x.id===id);if(!c)return;sel={kind:'cron',id};show(`<span class="kind">Cron</span><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.schedule)} · ${esc(c.human||'')} · ${esc(c.tz||'')}<br><span style="color:${c.enabled?(ST[c.status]||'var(--dim)'):'var(--off)'}">${c.enabled?esc(c.status):'disabled'}</span> · last ${esc(c.last_run||'—')} · next ${esc(c.next_run||'—')}</div><div class="md"><p>${esc(c.note||'')}</p></div><div class="sec"><h4>Agent</h4>${lnk('agent',c.agent,nameOf(c.agent),(A(c.agent)||{}).role)}</div>${c.flow?`<div class="sec"><h4>Flow</h4>${lnk('flow',c.flow,(S.flows.find(f=>f.id===c.flow)||{name:c.flow}).name,'')}</div>`:''}`);};
D.gen=id=>{const g=S.generations.find(x=>x.id===id);if(!g)return;sel={kind:'gen',id};show(`<span class="kind">Generation · ${esc(g.type)}</span><div class="name">${esc(g.title)}</div><div class="meta">${esc(g.date)}${g.path?'<br>'+esc(g.path):''}${g.url?`<br><a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.url)}</a>`:''}</div><div class="md">${md(g.body.replace(/^#\s.*\n/,""))}</div><div class="sec"><h4>Produced by</h4>${lnk('agent',g.agent,nameOf(g.agent),(A(g.agent)||{}).role)}${g.flow?lnk('flow',g.flow,(S.flows.find(f=>f.id===g.flow)||{name:g.flow}).name,'flow'):''}</div>`);};
D.task=id=>{const sp=S.sprints[0];const t=sp&&sp.tasks.find(x=>x.id===id);if(!t)return;sel={kind:'task',id};show(`<span class="kind">Sprint task · ${esc(t.status)}</span><div class="name">${esc(t.title)}</div><div class="meta"><span style="color:${PRI[t.priority]}">${esc(t.priority)}</span> · ${esc(t.company)} · due ${esc(t.due||'—')}${t.updated?' · updated '+esc(t.updated):''}</div><div class="md"><p>${esc(t.notes||'')}</p></div><div class="sec"><h4>Owner</h4>${t.owner==='gopakumar'?'<div class="lnk"><b>Gopakumar</b></div>':lnk('agent',t.owner,nameOf(t.owner),(A(t.owner)||{}).role)}</div>`);};

// ---------- flow playback ----------
function stopPlay(){if(play){clearInterval(play);play=null;}main.querySelectorAll('.step.on').forEach(s=>s.classList.remove('on'));}
function startPlay(){stopPlay();const f=S.flows.find(x=>x.id===flowId);const run=f&&f.runs.find(r=>r.id===runId);if(!run)return;const steps=main.querySelectorAll('.step');const log=$('log');let i=0;log.textContent='';
  const tick=()=>{steps.forEach(s=>s.classList.remove('on'));if(i>=f.steps.length){stopPlay();log.textContent+='\n— end of run —';return;}const s=f.steps[i],st=run.steps.find(x=>x.id===s.id)||{status:'pending'};steps[i].classList.add('on');steps[i].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
    log.textContent+=`${st.status.padEnd(8)} ${s.name} · ${nameOf(s.agent)}${st.note?' — '+st.note:''}\n`;log.scrollTop=log.scrollHeight;i++;};tick();play=setInterval(tick,900);}

// ---------- events ----------
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==='view')go(id);else if(a==='cochip'){filterCo=id||null;render();}else if(a==='close')detail.classList.remove('open');
  else if(a==='lfocus'){LIVE.focus=LIVE.focus===id?null:id;render();}else if(a==='lpause'){LIVE.paused=!LIVE.paused;render();}else if(a==='lspeed'){LIVE.speed=LIVE.speed>=4?1:LIVE.speed*2;render();}else if(a==='ltog'){LIVE[id]=!LIVE[id];render();}
  else if(a==='co'){go('agents',{co:id});D.co(id);}else if(a==='agentsco'){go('agents',{co:id});}
  else if(a==='agent')D.agent(id);else if(a==='skill'){D.skill(id);}else if(a==='flow'){flowId=id;runId=null;stopPlay();if(view!=='flows')go('flows');else render();}
  else if(a==='flowrun'){const [f,r]=id.split('|');flowId=f;runId=r;stopPlay();go('flows');}else if(a==='step')D.step(id);else if(a==='play')startPlay();else if(a==='stop')stopPlay();
  else if(a==='cron'){D.cron(id);}else if(a==='gen'){D.gen(id);}else if(a==='doc'){docId=id;if(view!=='docs')go('docs');else render();}
  else if(a==='task'){D.task(id);}else if(a==='move'){const [tid,status]=id.split('|');await api(`/api/sprints/${S.sprints[0].id}/tasks/${tid}`,'PATCH',{status});await refresh(true);}
});
document.addEventListener('change',e=>{if(e.target.id==='runsel'){runId=e.target.value;stopPlay();render();}});
document.addEventListener('submit',async e=>{if(e.target.id!=='addtask')return;e.preventDefault();const fd=new FormData(e.target);await api(`/api/sprints/${S.sprints[0].id}/tasks`,'POST',{title:fd.get('title'),owner:fd.get('owner'),priority:fd.get('priority')});e.target.reset();await refresh(true);});
q.addEventListener('input',()=>{query=q.value.trim().toLowerCase();render();});
async function api(url,method,body){try{const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json();}catch(err){alert('Write failed: '+err.message);}}

// ---------- boot ----------
async function refresh(force){if(window.__STATE__&&!force){S=window.__STATE__;return;}try{const r=await fetch('/api/state',{cache:'no-store'});const s=await r.json();if(!S||force||s.generated!==S.generated){S=s;render();}}catch{}}
(async()=>{if(window.__STATE__){S=window.__STATE__;}else{await refresh(true);if(!S){main.innerHTML='<p class="empty">Could not load /api/state — run <code>node server.js</code>.</p>';return;}}
  const h=location.hash.replace('#','');if(PANELS.some(p=>p[0]===h))view=h;render();
  if(S.mode==='live')setInterval(()=>refresh(false),5000);})();
})();
</script>
